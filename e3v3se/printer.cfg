#####################################################################
#   Includes
#####################################################################

[include gcode_macro.cfg]
[include printer_params.cfg]
[include prtouch.cfg]
[include mainsail.cfg]
[include mainsail/auto_power_off.cfg]
[include Helper-Script/save-zoffset.cfg]
[include Helper-Script/M600-support.cfg]
[include Helper-Script/screws-tilt-adjust.cfg]
[include Helper-Script/timelapse.cfg]

#####################################################################
#   MCU configuration
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

#####################################################################
#   Printer configuration
#####################################################################

[printer]
kinematics: cartesian
max_velocity: 400
max_accel: 4000
max_z_velocity: 15
square_corner_velocity: 5.0
max_z_accel: 300

[force_move]
enable_force_move: True

#####################################################################
#   Steppers configuration
#####################################################################

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ~!PA5
position_endstop: -6
position_min: -6
position_max: 227
homing_speed: 80

[tmc2208 stepper_x]
uart_pin: PB12
run_current: 0.60
sense_resistor: 0.150
interpolate: True

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ~!PA6
position_endstop: -14
position_min: -14
position_max: 230
homing_speed: 80

[tmc2208 stepper_y]
uart_pin: PB13
run_current: 0.60
sense_resistor: 0.150
interpolate: True

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0

[tmc2208 stepper_z]
uart_pin: PB14
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

#####################################################################
#   Extruder configuration
#####################################################################

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.44
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
# tuned for MicroSwiss Flowtech hotend with 220 degree Celsius target
pid_kp: 22.870
pid_ki: 2.584
pid_kd: 50.600
min_temp: 0
max_temp: 300
pressure_advance: 0.084
smooth_time: 0.02

#####################################################################
#   Bed configuration
#####################################################################

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
# tuned for stock hardware with 70 degree Celsius target
pid_kp: 66.371
pid_ki: 0.846
pid_kd: 1301.702
min_temp: 0
max_temp: 100

#####################################################################
#   Fans configuration
#####################################################################

[heater_fan hotend_fan]
pin: PC1

[fan]
pin: PA0

#####################################################################
#   Probe configuration
#####################################################################

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: 0.0
y_offset: 27.0
#z_offset: 0.0
speed: 20
pin_move_time: 0.4
stow_on_each_sample: False
probe_with_touch_mode: True

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    M204 S300 # Reset to stock Z accel for homing

    # 1. Safe Z lift (using force_move if Z isn't homed)
    {% if "z" not in printer.toolhead.homed_axes %}
        FORCE_MOVE STEPPER=stepper_z DISTANCE=10 VELOCITY=10
        SET_KINEMATIC_POSITION Z=0
    {% else %}
        G91
        G1 Z10 F600
        G90
    {% endif %}

    # 2. Home X if requested OR part of home_all OR needed for Z
    {% if home_all or 'X' in params or ('Z' in params and "x" not in printer.toolhead.homed_axes) %}
        G28 X
    {% endif %}

    # 3. Home Y if requested OR part of home_all OR needed for Z
    {% if home_all or 'Y' in params or ('Z' in params and "y" not in printer.toolhead.homed_axes) %}
        G28 Y
    {% endif %}

    # 4. Home Z if requested OR part of home_all
    {% if home_all or 'Z' in params %}
        M204 S300 # Slow Z accel
        G90
        G1 X110 Y83 F9000
        G28 Z
        # Move nozzle to center
        G1 X110 Y110 Z10 F9000 # Move at 150mm/s
        M204 S4000 # Restore high global accel
    {% endif %}

#####################################################################
#   Mesh configuration
#####################################################################

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20,20
mesh_max: 204,207
probe_count: 5,5
algorithm: bicubic

#####################################################################
#   Display & Beepers configuration
#####################################################################

[e3v3se_display]

[e3v3se_display MACRO1]
gcode: LOAD_MATERIAL
label: Load filament
icon: 14

[e3v3se_display MACRO2]
gcode: QUIT_MATERIAL
label: Unload filament
icon: 14

[e3v3se_display MACRO3]
gcode: Z_OFFSET_TEST
label: Calibrate Z offset
icon: 12

[e3v3se_display MACRO4]
gcode: BED_MESH_CALIBRATE PROFILE="default"
label: Calibrate bed mesh
icon: 29

[e3v3se_display MACRO5]
gcode: CLEAN_NOZZLE
label: Clean nozzle
icon: 9

[e3v3se_display MACRO6]
gcode: POWER_OFF_PRINTER
label: Power OFF printer
icon: 41

[e3v3se_display MACRO7]
gcode: POWEROFF_CANCEL
label: Cancel auto-poweroff
icon: 16

[output_pin beeper]
pin: PB0

#####################################################################
#   G-Code features
#####################################################################

[gcode_arcs]

[exclude_object]

[respond]

#####################################################################
#   Temperature Sensors configuration
#####################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor CPU]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

#####################################################################
#   Auto Power Off configuration
#####################################################################

[auto_power_off]
idle_timeout: 1800
temp_threshold: 40
power_device: printer
auto_poweroff_enabled: True
language: auto
diagnostic_mode: False

[delayed_gcode STARTUP_RUN]
initial_duration: 1
gcode:
    STARTUP

