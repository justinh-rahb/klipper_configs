# Ender-3V3 SE Macros (Ported from KE)

[exclude_object]

[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[pause_resume]

[display_status]

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro M204]
rename_existing: M204.1
gcode:
  {% set get_params = "" %}
  {% if 'S' in params|upper %}
    {% set get_params = (get_params + ' ' + 'S' + params.S) %}
  {% endif %}
  {% if 'P' in params|upper %}
    {% set get_params = (get_params + ' ' + 'P' + params.P) %}
  {% endif %}
  {% if 'T' in params|upper %}
    {% set get_params = (get_params + ' ' + 'T' + params.T) %}
  {% endif %}
  M204.1 {get_params}

[gcode_macro M205]
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

[gcode_macro G29]
gcode:
  M204 S4000
  G90
  G28
  BED_MESH_CALIBRATE
  G1 X110 Y110 Z10
  SAVE_CONFIG

[gcode_macro LOAD_MATERIAL]
gcode:
  SAVE_GCODE_STATE NAME=load_state
  M109 S{printer['gcode_macro PRINTER_PARAM'].default_extruder_temp}
  G91
  G1 E100 F180
  RESTORE_GCODE_STATE NAME=load_state

[gcode_macro QUIT_MATERIAL]
gcode:
  SAVE_GCODE_STATE NAME=unload_state
  M109 S{printer['gcode_macro PRINTER_PARAM'].default_extruder_temp}
  G91
  G1 E20 F180
  G1 E-80 F2000
  RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro STARTUP]
description: "Apply saved configurations at startup"
gcode:
    BED_MESH_PROFILE LOAD=default
    # Load Z-offset persistence is handled by LOAD_GCODE_OFFSETS delayed gcode
    POWEROFF_START
    FINISH_INIT

[gcode_macro FINISH_INIT]
gcode:
  {% set extruder = printer.configfile.settings['extruder'] %}
  SET_PRESSURE_ADVANCE ADVANCE={extruder.pressure_advance}
  SET_PRESSURE_ADVANCE EXTRUDER=extruder SMOOTH_TIME={extruder.smooth_time}
  # SE specific initializations
  M220 S100
  M221 S100

[gcode_macro Z_OFFSET_TEST]
description: "Run Z-offset calibration"
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SET_GCODE_OFFSET Z=0
  PRTOUCH_PROBE_ZOFFSET CLEAR_NOZZLE=1 APPLY_Z_ADJUST=1

[gcode_macro ZZ_OFFSET_TEST]
description: "Run Auto Z-offset calibration"
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SET_GCODE_OFFSET Z=0
  PRTOUCH_PROBE_ZOFFSET CLEAR_NOZZLE=0 APPLY_Z_ADJUST=1

[gcode_macro Z_COMPENSATE_TEST]
description: "Run Z-offset compensation (Full wipe)"
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SET_GCODE_OFFSET Z=0
  PRTOUCH_PROBE_ZOFFSET CLEAR_NOZZLE=1 APPLY_Z_ADJUST=1

[gcode_macro PRINT_START]
description: "Prepare the printer for a new print"
gcode:
    {% set bed_temp = params.BED | default(60) | float %}
    {% set extruder_temp = params.EXTRUDER | default(220) | float %}
    POWEROFF_CANCEL                                 ; Cancel auto poweroff timer
    CLEAR_PAUSE                                     ; Clear Pause
    M190 S{bed_temp}                                ; Heat bed_temp and wait
    M104 S150                                       ; Preheat extruder to 150°C
    G28                                             ; Home all axes
    BED_MESH_CALIBRATE PROFILE="default"
    M104 S{extruder_temp}                           ; Set final extruder temperature
    G0 X1 Y1 Z1 F5000                               ; Move to front-left to heat nozzle
    M109 S{extruder_temp}                           ; Set extruder temp and wait
    LINE_PURGE

[gcode_macro PRINT_END]
description: "Cleanup after a print"
gcode:
    G91                 ; Relative positioning
    G1 E-2 F2700        ; Retract a bit
    G1 E-2 Z0.2 F2400   ; Retract and raise Z
    G0 X5 Y5 F3000      ; Wipe out
    G0 Z10              ; Raise Z more
    G90                 ; Absolute positioning
    G0 X0 Y220          ; Present print
    M106 S0             ; Turn-off fan
    M104 S0             ; Turn-off hotend
    M140 S0             ; Turn-off bed_temp
    M84                 ; Disable stepper motors
    POWEROFF_START

[gcode_macro LINE_PURGE]
gcode:
    G92 E0                      ; Reset Extruder
    G1 Z2 F3000                 ; Move Z Axis up little to prevent scratching of Heat Bed
    G1 X1 Y20 Z0.4 F5000        ; Move to start position
    G1 X1 Y145 Z0.4 E15 F1500   ; Draw the first line
    G1 X1.3 Y145 Z0.4 F5000     ; Move to side a little
    G1 X1.3 Y20 Z0.4 E30 F1500  ; Draw the second line
    G92 E0                      ; Reset Extruder
    G1 E-1 F1800                ; Retract a bit 
    G0 Z2 F3000                 ; Move Z Axis up little to prevent scratching of Heat Bed
    G1 E0 F1800                 ; Unretract/Reset Extruder

[gcode_macro M109]
description: "Override M109 to wait for temperature with tolerance"
rename_existing: M99109
gcode:
    {% set s = params.S | float %}
    M104 {% for p in params %} {'%s%s' % (p, params[p])} {% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}
    {% endif %}

[gcode_macro M190]
description: "Override M190 to wait for temperature with tolerance"
rename_existing: M99190
gcode:
    {% set s = params.S | float %}
    M140 {% for p in params %} {'%s%s' % (p, params[p])} {% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}
    {% endif %}

[gcode_macro PID_EXTRUDER]
description: "Run PID calibration for the extruder"
gcode:
  {% set target = params.TARGET | default(220) | float %}
  PID_CALIBRATE HEATER=extruder TARGET={target}
  SAVE_CONFIG

[gcode_macro PID_BED]
description: "Run PID calibration for the bed"
gcode:
  {% set target = params.TARGET | default(60) | float %}
  PID_CALIBRATE HEATER=heater_bed TARGET={target}
  SAVE_CONFIG

[gcode_macro BEEP]
description: "Sound the beeper"
gcode:
    {% set duration = params.P | default(100) | float %}
    SET_PIN PIN=beeper VALUE=1
    G4 P{duration}
    SET_PIN PIN=beeper VALUE=0

[gcode_macro OFF]
description: "Turn off all heaters and fans"
gcode:
    M84                 ; Turn steppers off
    TURN_OFF_HEATERS    ; Turn bed_temp / hotend off
    M107                ; Turn print cooling fan off

[delayed_gcode bed_safety]
initial_duration: 2.
gcode:
  {% if printer.heater_bed.temperature >= settings.heater_bed.max_temp %}
    M118 EXCEED_THERMAL_LIMIT_BED
    POWER_OFF_PRINTER
  {% else %}
    UPDATE_DELAYED_GCODE ID=bed_safety DURATION=2
  {% endif %}

[delayed_gcode extruder_safety]
initial_duration: 2.
gcode:
  {% if printer.extruder0.temperature >= settings.extruder.max_temp %}
    M118 EXCEED_THERMAL_LIMIT_EXTRUDER
    POWER_OFF_PRINTER
  {% else %}
    UPDATE_DELAYED_GCODE ID=extruder_safety DURATION=2
  {% endif %}
