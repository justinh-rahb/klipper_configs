[gcode_macro _MOVE_TO_PURGE_START]
gcode:
    {% set purge_margin = 10 %}
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% if all_points %}
        {% set x_min = all_points | map(attribute=0) | min %}
        {% set y_min = all_points | map(attribute=1) | min %}
        {% set purge_x = [x_min - 5, 1] | max %}
        {% set purge_y = [y_min - purge_margin, 1] | max %}
    {% else %}
        {% set purge_x = 1 %}
        {% set purge_y = 20 %}
    {% endif %}
    G0 X{purge_x} Y{purge_y} Z1 F5000

[gcode_macro LINE_PURGE]
gcode:
    {% set adaptive_enable = params.ADAPTIVE_ENABLE|default('false')|lower %}
    {% set purge_margin = params.PURGE_MARGIN|default(10)|int %}
    {% set purge_length = params.PURGE_LENGTH|default(50)|int %}
    
    {% if adaptive_enable == 'true' %}
        {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
        {% if all_points %}
            {% set x_min = all_points | map(attribute=0) | min %}
            {% set y_min = all_points | map(attribute=1) | min %}
            {% set purge_x_start = [x_min - 5, 1] | max %}
            {% set purge_x_end = purge_x_start + purge_length %}
            {% set purge_y = [y_min - purge_margin, 1] | max %}
        {% else %}
            {% set purge_x_start = 1 %}
            {% set purge_x_end = purge_x_start + purge_length %}
            {% set purge_y = 20 %}
        {% endif %}
    {% else %}
        {% set purge_x_start = 1 %}
        {% set purge_x_end = purge_x_start + purge_length %}
        {% set purge_y = 20 %}
    {% endif %}
    
    G92 E0
    G1 Z2 F3000
    G1 X{purge_x_start} Y{purge_y} Z0.4 F5000
    G1 X{purge_x_end} Y{purge_y} Z0.4 E10 F1500
    G1 X{purge_x_end} Y{purge_y + 0.3} Z0.4 F5000
    G1 X{purge_x_start} Y{purge_y + 0.3} Z0.4 E20 F1500
    G92 E0
    G1 E-1 F1800
    G0 Z2 F3000
    G1 E0 F1800