# Manual Bridges for LED Instance
# These macros forward commands to the decoupled LED instance via Klipper Router

[gcode_macro DISCO_PARTY]
gcode:
    ROUTER_GCODE_SCRIPT TARGET=led SCRIPT=DISCO_PARTY

[gcode_macro DISCO_BREATHING]
gcode:
    ROUTER_GCODE_SCRIPT TARGET=led SCRIPT=DISCO_BREATHING

