# ==== DISCO LED HOOKS (SE Port) ====
# Ported for Ender-3 V3 SE
# Hooks into Mainsail macros and overrides SE-specific macros

[delayed_gcode startup_status_light]
initial_duration: 3.0
gcode:
    DISCO_COMPLETE
    DISCO_IDLE
    #STATUS_READY

# Hook into Mainsail's PAUSE, RESUME, CANCEL_PRINT
[gcode_macro _CLIENT_VARIABLE]
variable_user_pause_macro: "STATUS_PAUSED"
variable_user_resume_macro: "STATUS_PRINTING"
variable_user_cancel_macro: "STATUS_ERROR"
gcode:

[gcode_macro PRINT_START]
rename_existing: PRINT_START_BASE
gcode:
    STATUS_HEATING
    PRINT_START_BASE {rawparams}
    STATUS_PRINTING

[gcode_macro PRINT_END]
rename_existing: PRINT_END_BASE
gcode:
    PRINT_END_BASE {rawparams}
    STATUS_COMPLETE

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    STATUS_LEVELING
    BED_MESH_CALIBRATE_BASE {rawparams}
    STATUS_READY

[gcode_macro SHAPER_CALIBRATE]
rename_existing: SHAPER_CALIBRATE_BASE
gcode:
    STATUS_LEVELING
    SHAPER_CALIBRATE_BASE {rawparams}
    STATUS_READY
